plugins {
    id "com.gradleup.shadow" version "9.5.1"
}

def unobfuscated = rootProject.findProperty("unobfuscated") == "true"

base {
    archivesName = "${rootProject.archives_base_name}-fabric"
}

if (unobfuscated) {
    sourceSets.main.java.setSrcDirs(["src/main/javaMojmap26"])
    sourceSets.main.resources.setSrcDirs([
        "src/unobfuscated/resources",
        "src/main/resources"
    ])
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    enableModProvidedJavadoc.set(false)
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

def geckolibGroup = rootProject.findProperty("geckolib_group") ?: "software.bernie.geckolib"
def geckolibMc = rootProject.findProperty("geckolib_artifact_mc") ?: rootProject.minecraft_version
def geckolibCoord = "${geckolibGroup}:geckolib-fabric-${geckolibMc}:${rootProject.geckolib_version}"

dependencies {
    if (unobfuscated) {
        compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        compileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
        compileOnly geckolibCoord
        common(project(":common")) { transitive false }
        shadowCommon(project(path: ":common", configuration: "runtimeElements")) { transitive false }
    } else {
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
        modImplementation geckolibCoord
        common(project(path: ":common", configuration: "namedElements")) { transitive false }
        shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
    }
}

processResources {
    if (unobfuscated) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    inputs.property "version", project.version
    inputs.property "minecraft_compat", rootProject.findProperty("minecraft_compat") ?: "~1.21.11"
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_compat": minecraft_compat
    }
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = unobfuscated ? "" : "dev-shadow"
}

if (unobfuscated) {
    tasks.register("remapJar") {
        dependsOn(tasks.named("shadowJar"))
        group = "build"
        description = "Production jar (unobfuscated; alias for shadowJar)"
    }
} else {
    remapJar {
        input.set shadowJar.archiveFile
        dependsOn shadowJar
        archiveClassifier = null
    }
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
