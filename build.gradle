plugins {
    id "architectury-plugin" version "${architectury_plugin_version}"
    id "dev.architectury.loom" version "${architectury_loom_version}" apply false
    id "dev.architectury.loom-no-remap" version "${architectury_loom_version}" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

def gazeUnobfuscated = findProperty("unobfuscated") == "true"

subprojects {
    if (gazeUnobfuscated) {
        apply plugin: "dev.architectury.loom-no-remap"
    } else {
        apply plugin: "dev.architectury.loom"
    }

    loom {
        silentMojangMappingsLicense()
        runConfigs.configureEach {
            runDir = "../run"
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        if (!gazeUnobfuscated) {
            mappings loom.officialMojangMappings()
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }

    version = "${rootProject.mod_version}-${rootProject.minecraft_version}+${project.name}"
    group = rootProject.maven_group

    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.architectury.dev/" }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        def release = findProperty("unobfuscated") == "true" ? 25 : 21
        options.release = release
    }

    java {
        if (findProperty("unobfuscated") == "true") {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        } else {
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }
        withSourcesJar()
    }
}
