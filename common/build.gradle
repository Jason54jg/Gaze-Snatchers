architectury {
    common(rootProject.enabled_platforms.split(","))
}

def unobfuscated = rootProject.findProperty("unobfuscated") == "true"

if (unobfuscated) {
    sourceSets.main.java.setSrcDirs(["src/main/javaMojmap26"])
}

dependencies {
    if (unobfuscated) {
        compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        // APIs GeckoLib (1.21.11) — les loaders ajoutent l'impl runtime
        modCompileOnly "software.bernie.geckolib:geckolib-fabric-1.21.11:${rootProject.geckolib_version}"
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
